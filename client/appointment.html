<section class="services">

<h2>Book an Appointment</h2>

<form id="appointmentForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<select id="doctor" required>
<option value="">Select Doctor</option>
<option>Dr. Rahul Sharma</option>
<option>Dr. Priya Singh</option>
<option>Dr. Arjun Patel</option>
<option>Dr. Sneha Reddy</option>
<option>Dr. Vikram Rao</option>
<option>Dr. Anjali Mehta</option>
</select>

<input type="date" id="date" required>

<input type="time" id="time" required>

<button class="btn" type="submit">Book Appointment</button>

</form>

<p id="message"></p>

</section>
